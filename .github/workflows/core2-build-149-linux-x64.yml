name: core2-build-149-linux-x64
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('core2-149-lx64 profile={0} jobs={1} mode={2} cache={3} source={4}', inputs.build_profile, inputs.compile_jobs, inputs.build_mode, format('{0}', inputs.use_upstream_cache), '149.0.7827.200') || 'core2-build-149-linux-x64' }}

on:
  workflow_dispatch:
    inputs:
      compile_jobs:
        description: 'Ninja jobs: auto uses CPU/memory limits, or a positive integer'
        type: string
        default: auto
      build_profile:
        description: 'ThinLTO optimization profile for the Chromium 149 Core 2 build'
        type: choice
        options: [fast, release]
        default: fast
      build_mode:
        description: 'Staged snapshot/resume or a single job that must finish'
        type: choice
        options: [staged, single]
        default: staged
      use_upstream_cache:
        description: 'Require the pinned upstream cache; false avoids it, but the 149 patch stack is not yet validated'
        type: boolean
        default: false
permissions:
  actions: read
  contents: read

concurrency:
  group: core2-build-149-linux-x64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Linux x64 Core 2 (149.0.7827.200, 8-stage build)
    uses: ./.github/workflows/build-posix-github.yml
    with:
      platform: linux
      arch: x64
      runner: ubuntu-22.04
      artifact: chromix-linux-x64-core2-149
      max-stages: ${{ inputs.build_mode == 'single' && 1 || 8 }}
      build_profile: ${{ inputs.build_profile || 'fast' }}
      compile_jobs: ${{ inputs.compile_jobs || 'auto' }}
      use_upstream_cache: ${{ github.event_name != 'workflow_dispatch' || inputs.use_upstream_cache }}
      core2_cpu: true
    secrets: inherit
