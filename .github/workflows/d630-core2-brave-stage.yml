name: d630-core2-brave-stage

on:
  workflow_call:
    inputs:
      runner_label:
        required: true
        type: string
      stage:
        required: true
        type: number
      previous_stage:
        required: false
        type: number
        default: 0
      previous_attempt:
        required: false
        type: string
        default: ''
      brave_core_ref:
        required: true
        type: string
      resume_run_id:
        required: false
        type: string
        default: ''
      resume_stage:
        required: false
        type: string
        default: '1'
      resume_attempt:
        required: false
        type: string
        default: '1'
    outputs:
      finished:
        description: Whether the Core 2 build completed
        value: ${{ jobs.build.outputs.finished }}
      snapshot_attempt:
        description: Attempt number containing this stage's checkpoint
        value: ${{ jobs.build.outputs.snapshot_attempt }}

permissions:
  actions: read
  contents: write

jobs:
  build:
    name: Core 2 build stage ${{ inputs.stage }}
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 355
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
      snapshot_attempt: ${{ steps.origin.outputs.attempt }}
    steps:
      - uses: actions/checkout@v4

      - name: Record checkpoint attempt
        id: origin
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Validate external checkpoint selection
        if: inputs.stage == 1 && inputs.resume_run_id != ''
        env:
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          RESUME_STAGE: ${{ inputs.resume_stage }}
          RESUME_ATTEMPT: ${{ inputs.resume_attempt }}
        run: |
          set -euo pipefail
          [[ "$RESUME_RUN_ID" =~ ^[0-9]{1,20}$ ]]
          [[ "$RESUME_STAGE" =~ ^[1-8]$ ]]
          [[ "$RESUME_ATTEMPT" =~ ^[1-9][0-9]{0,5}$ ]]

      - name: Record runner resources
        run: |
          set -euo pipefail
          {
            uname -a
            getconf _NPROCESSORS_ONLN
            free -h
            echo 'Filesystem capacity before cleanup (build/temp/workspace paths):'
            df -hT /tmp "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
            df -B1 --output=source,size,used,avail,target /tmp "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
          } 2>&1 | tee "${RUNNER_TEMP}/core2-runner-before-cleanup.log"

      - name: Free Linux disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/local/.ghcup /usr/lib/jvm \
            /usr/local/share/boost /usr/share/swift \
            /usr/lib/dotnet /usr/lib/google-cloud-sdk
          sudo docker system prune -af || true
          echo 'Filesystem capacity after cleanup (build/temp/workspace paths):'
          df -hT /tmp "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
          df -B1 --output=source,size,used,avail,target /tmp "$RUNNER_TEMP" "$GITHUB_WORKSPACE"

      - name: Install Linux build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            apparmor-utils bison build-essential clang clang-format cmake curl flex g++ git gperf \
            libasound2-dev libatk1.0-dev libcups2-dev libdrm-dev libegl1-mesa-dev \
            libevent-dev libflac-dev libgbm-dev libglib2.0-dev libgtk-3-dev \
            libjpeg-dev libnss3-dev libopus-dev libpam0g-dev libpci-dev \
            libpipewire-0.3-dev libpulse-dev libspeechd-dev libudev-dev \
            libva-dev libvpx-dev libwebp-dev libx11-xcb-dev libxcb-dri3-dev \
            libxshmfence-dev libxslt1-dev libxss-dev libxtst-dev mesa-common-dev \
            ninja-build pkg-config python3-jinja2 python3-pyparsing \
            python3-setuptools python3-six rsync uuid-dev xz-utils yasm zip unzip zstd

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
          run_install: false

      - name: Download and verify checkpoint release
        if: inputs.stage > 1 || (inputs.stage == 1 && inputs.resume_run_id != '')
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_RUN_ID: ${{ inputs.stage > 1 && github.run_id || inputs.resume_run_id }}
          CHECKPOINT_STAGE: ${{ inputs.stage > 1 && inputs.previous_stage || inputs.resume_stage }}
          CHECKPOINT_ATTEMPT: ${{ inputs.stage > 1 && inputs.previous_attempt || inputs.resume_attempt }}
          BRAVE_CORE_REF: ${{ inputs.brave_core_ref }}
        run: |
          set -euo pipefail
          python3 tools/core2_release_checkpoint.py download \
            --repo "$GITHUB_REPOSITORY" \
            --run-id "$CHECKPOINT_RUN_ID" \
            --attempt "$CHECKPOINT_ATTEMPT" \
            --stage "$CHECKPOINT_STAGE" \
            --brave-core-ref "$BRAVE_CORE_REF" \
            --destination "${RUNNER_TEMP}/core2-restore"

      - name: Restore previous stage checkpoint
        if: inputs.stage > 1 || (inputs.stage == 1 && inputs.resume_run_id != '')
        run: |
          set -euo pipefail
          bash build/posix/restore-snapshot.sh \
            "${RUNNER_TEMP}/core2-restore" "${RUNNER_TEMP}/core2-work"

      - name: Verify restored disk headroom
        if: inputs.stage > 1 || (inputs.stage == 1 && inputs.resume_run_id != '')
        run: |
          df -hT "${RUNNER_TEMP}/core2-work"
          df -B1 --output=source,size,used,avail,target "${RUNNER_TEMP}/core2-work"

      - name: Run build stage
        id: stage
        env:
          BRAVE_CORE_REF: ${{ inputs.brave_core_ref }}
        run: |
          set -o pipefail
          bash build/core2/stage.sh \
            "${RUNNER_TEMP}/core2-work" '${{ inputs.stage }}' "$BRAVE_CORE_REF" 8 \
            2>&1 | tee "${RUNNER_TEMP}/core2-stage-${{ inputs.stage }}.log"

      - name: Upload stage log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core2-brave-run-${{ github.run_id }}-stage-${{ inputs.stage }}-log-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/core2-stage-${{ inputs.stage }}.log
            ${{ runner.temp }}/core2-runner-before-cleanup.log
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

      - name: Publish checkpoint chunks to GitHub Release
        if: always() && steps.stage.outputs.snapshot_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_RUN_ID: ${{ github.run_id }}
          CHECKPOINT_ATTEMPT: ${{ github.run_attempt }}
          CHECKPOINT_STAGE: ${{ inputs.stage }}
          BRAVE_CORE_REF: ${{ inputs.brave_core_ref }}
        run: |
          set -euo pipefail
          python3 tools/core2_release_checkpoint.py upload \
            --repo "$GITHUB_REPOSITORY" \
            --run-id "$CHECKPOINT_RUN_ID" \
            --attempt "$CHECKPOINT_ATTEMPT" \
            --stage "$CHECKPOINT_STAGE" \
            --brave-core-ref "$BRAVE_CORE_REF" \
            --snapshot "${RUNNER_TEMP}/core2-work/.snapshot-stage-${CHECKPOINT_STAGE}" \
            --workdir "${RUNNER_TEMP}/core2-work"
