name: build-macos-arm64

on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: 'Completed Mac ARM64 run whose exact checkpoint starts this new eight-stage build'
        type: string
        default: ''
      resume_tree_stage:
        description: 'Donor checkpoint stage (1-8)'
        type: string
        default: '7'
      resume_artifact_ids:
        description: 'Complete comma-separated artifact ID set recorded for the donor checkpoint'
        type: string
        default: ''
      resume_attempt:
        description: 'Exact attempt that uploaded the donor checkpoint'
        type: string
        default: '1'
      compile_jobs:
        description: 'Ninja jobs: auto uses CPU/memory limits, or a positive integer'
        type: string
        default: auto
      build_profile:
        description: 'ThinLTO optimization profile'
        type: choice
        options: [fast, release]
        default: fast
      build_mode:
        description: 'Staged snapshot/resume or a single job that must finish'
        type: choice
        options: [staged, single]
        default: staged
      use_upstream_cache:
        description: 'Require pinned full upstream source + out/Default reuse; false permits cold builds'
        type: boolean
        default: true
permissions:
  actions: read
  contents: read

concurrency:
  group: build-macos-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: macOS Apple Silicon (8-stage snapshot/resume)
    uses: ./.github/workflows/build-posix-github.yml
    with:
      platform: macos
      arch: arm64
      runner: macos-15
      artifact: chromix-mac-arm64
      max-stages: ${{ inputs.build_mode == 'single' && 1 || 8 }}
      build_profile: ${{ inputs.build_profile || 'fast' }}
      compile_jobs: ${{ inputs.compile_jobs || 'auto' }}
      resume_run_id: ${{ inputs.resume_run_id || '' }}
      resume_tree_stage: ${{ inputs.resume_tree_stage || '7' }}
      resume_attempt: ${{ inputs.resume_attempt || '1' }}
      resume_artifact_ids: ${{ inputs.resume_artifact_ids || '' }}
      use_upstream_cache: ${{ github.event_name != 'workflow_dispatch' || inputs.use_upstream_cache }}
    secrets: inherit
